[project]
name = "lotcouncil"
version = "1.0.0"
description = "Put a trading idea on trial: a deterministic court for Bitget tokenized-stock strategies."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "tzdata",
]

[project.optional-dependencies]
agent = ["mcp>=1.2"]
dev = ["pytest>=8", "httpx>=0.27", "ruff"]

[project.scripts]
lotcouncil = "lotcouncil.__main__:main"

[tool.setuptools]
packages = ["lotcouncil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.ruff.lint.per-file-ignores]
"lotcouncil/ai.py" = ["E501"]  # the model prompts are prose
